name: Deploy Rekixo AR3D Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Build-dependent tests (including rendered-html) must pass on Linux before
      # any D1 migration or Worker deployment can start.
      - name: Run full regression suite
        run: node --test tests/*.test.mjs

      # Before any production mutation, prove every non-legacy published client
      # has the exact structural snapshot expected by the fail-closed runtime.
      # This is read-only and stops the deploy before migrations/Workers if a
      # current client would otherwise become unavailable.
      - name: Preflight current published client snapshots
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute tiyansh-production --remote --json \
            --command "SELECT p.id,p.name,p.publish_version AS publishVersion,s.publish_version AS snapshotVersion FROM projects p LEFT JOIN project_public_snapshots s ON s.project_id=p.id WHERE p.status='active' AND p.public_status='published' AND p.id!='tiyansh-prime-square' AND (s.project_id IS NULL OR s.publish_version<>p.publish_version) ORDER BY p.id;" \
            > /tmp/rekixo-published-snapshot-preflight.json
          node --input-type=module - /tmp/rekixo-published-snapshot-preflight.json <<'NODE'
          import { readFile } from "node:fs/promises";
          const payload = JSON.parse(await readFile(process.argv[2], "utf8"));
          const rows = [];
          const walk = (value) => {
            if (Array.isArray(value)) {
              for (const item of value) walk(item);
              return;
            }
            if (!value || typeof value !== "object") return;
            if (Array.isArray(value.results)) rows.push(...value.results);
            for (const item of Object.values(value)) walk(item);
          };
          walk(payload);
          const unique = [...new Map(rows.map((row) => [String(row.id), row])).values()];
          if (unique.length) {
            console.error("STOP: published clients with missing/stale snapshot:");
            for (const row of unique) {
              console.error(`- ${row.id} · ${row.name || "Project"} · live=${row.publishVersion} snapshot=${row.snapshotVersion ?? "missing"}`);
            }
            process.exit(1);
          }
          console.log("Published client snapshot preflight passed.");
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Recover the source CSV already stored in R2 and validate its 37 rows
      # against current D1. No user-supplied CSV or fabricated plot sizes.
      - name: Prepare guarded Talib 37-to-36 CSV from current production data
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute tiyansh-production --remote --json --command "SELECT id,sqft,status,polygon,inventory_active AS active FROM plots WHERE project_id='e94cec2c-e3f7-4a13-aa75-5ec4167baaf2' ORDER BY CAST(id AS INTEGER);" > /tmp/talib-before.json
          node scripts/talib-37-to-36-csv.mjs inspect /tmp/talib-before.json
          if grep -qx 'TALIB_REMAP_NEEDED=true' "$GITHUB_ENV"; then
            npx wrangler r2 object get 'tiyansh-gallery-production/projects/e94cec2c-e3f7-4a13-aa75-5ec4167baaf2/mapper/plotSheet' --remote --file=/tmp/talib-old-source.csv
            node scripts/talib-37-to-36-csv.mjs convert /tmp/talib-before.json /tmp/talib-old-source.csv /tmp/talib-36-final.csv /tmp/talib-former-32-commercial.csv
            npx wrangler r2 object put 'tiyansh-gallery-production/projects/e94cec2c-e3f7-4a13-aa75-5ec4167baaf2/backups/plotSheet-37-before-36-20261022.csv' --remote --file=/tmp/talib-old-source.csv --content-type='text/csv; charset=utf-8'
            npx wrangler r2 object put 'tiyansh-gallery-production/projects/e94cec2c-e3f7-4a13-aa75-5ec4167baaf2/backups/former-plot-32-commercial-20261022.csv' --remote --file=/tmp/talib-former-32-commercial.csv --content-type='text/csv; charset=utf-8'
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Additive migrations run before the new V5 Workers. Existing legacy Worker
      # remains compatible while the columns/table are being added.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply tiyansh-production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # This SQL has an exact project/37-row/image guard and durable backups.
      # It changes draft only; the previous 37-plot public snapshot stays live
      # until the 36 new masterplan polygons are mapped and Publish Update runs.
      - name: Migrate Talib draft inventory 37 to 36
        if: env.TALIB_REMAP_NEEDED == 'true'
        run: npx wrangler d1 execute tiyansh-production --remote --file=scripts/sql/apply-talib-37-to-36-once.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Replace and verify Talib source CSV after successful D1 migration
        if: env.TALIB_REMAP_NEEDED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object put 'tiyansh-gallery-production/projects/e94cec2c-e3f7-4a13-aa75-5ec4167baaf2/mapper/plotSheet' --remote --file=/tmp/talib-36-final.csv --content-type='text/csv; charset=utf-8'
          npx wrangler r2 object get 'tiyansh-gallery-production/projects/e94cec2c-e3f7-4a13-aa75-5ec4167baaf2/mapper/plotSheet' --remote --file=/tmp/talib-36-readback.csv
          npx wrangler d1 execute tiyansh-production --remote --json --command "SELECT id,sqft,status,polygon,inventory_active AS active FROM plots WHERE project_id='e94cec2c-e3f7-4a13-aa75-5ec4167baaf2' ORDER BY CAST(id AS INTEGER);" > /tmp/talib-after.json
          node scripts/talib-37-to-36-csv.mjs verify /tmp/talib-after.json /tmp/talib-36-readback.csv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Exact project-scoped structural publish (v12 to v13). All other live
      # projects and old immutable v12 masterplan bytes remain unchanged.
      - name: Prepare immutable Noorpur published asset snapshot for C6/C7 retirement
        shell: bash
        run: |
          set -euo pipefail
          ID=ca24581e-0dbc-41d7-964b-435c563534cd
          B=tiyansh-gallery-production
          npx wrangler d1 execute tiyansh-production --remote --json --command "SELECT p.publish_version AS version,(SELECT COUNT(*) FROM plots WHERE project_id=p.id AND inventory_active=1) AS draft,(SELECT COUNT(*) FROM published_plots WHERE project_id=p.id) AS published FROM projects p WHERE p.id='$ID' AND p.name='NOORPUR HILLS ESTATE' AND p.public_status='published';" > /tmp/noorpur-state.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('/tmp/noorpur-state.json','utf8'));
          const row=data.flatMap(x=>x.results||[])[0];
          if(!row)throw Error('Noorpur project not found');
          if(Number(row.version)===13 && Number(row.draft)===209 && Number(row.published)===209){
            fs.appendFileSync(process.env.GITHUB_ENV,'NOORPUR_MIGRATE=false\n');
            console.log('NOORPUR_ALREADY_209: skip existing migration');
          }else if(Number(row.version)===12 && Number(row.draft)===211 && Number(row.published)===211){
            fs.appendFileSync(process.env.GITHUB_ENV,'NOORPUR_MIGRATE=true\n');
            console.log('NOORPUR_PRECHECK_211: C6/C7 migration eligible');
          }else throw Error('Unexpected Noorpur inventory or publish revision — refusing mutation');
          NODE
          if ! grep -qx 'NOORPUR_MIGRATE=true' "$GITHUB_ENV"; then exit 0; fi

          # Preserve byte-for-byte copies of the currently published image,
          # including optional original/brand assets. No image regeneration.
          for kind in masterplan masterplanPublic masterplanOriginal logo; do
            old="$B/projects/$ID/published/12/$kind"
            new="$B/projects/$ID/published/13/$kind"
            if npx wrangler r2 object get "$old" --remote --file="/tmp/noorpur-old-$kind" > /tmp/noorpur-get.log 2>&1; then
              mime=$(file -b --mime-type "/tmp/noorpur-old-$kind")
              npx wrangler r2 object put "$new" --remote --file="/tmp/noorpur-old-$kind" --content-type="$mime"
              npx wrangler r2 object get "$new" --remote --file="/tmp/noorpur-verify-$kind"
              cmp "/tmp/noorpur-old-$kind" "/tmp/noorpur-verify-$kind"
              echo "NOORPUR_R2_ASSET_MIRRORED: $kind SHA256 $(sha256sum "/tmp/noorpur-old-$kind" | cut -d' ' -f1)"
            elif [[ "$kind" == "masterplan" ]]; then
              echo "Required published masterplan v12 missing — stopping"; cat /tmp/noorpur-get.log; exit 1
            else
              echo "NOORPUR_OPTIONAL_ASSET_ABSENT: $kind"
            fi
          done

          # Original source CSV is optional (B/C may have been added in mapper);
          # if present, back it up before removing C6/C7 from the sheet.
          if npx wrangler r2 object get "$B/projects/$ID/mapper/plotSheet" --remote --file=/tmp/noorpur-old-source > /tmp/noorpur-source.log 2>&1; then
            node scripts/noorpur-filter-plot-sheet.mjs /tmp/noorpur-old-source /tmp/noorpur-new-source
            npx wrangler r2 object put "$B/projects/$ID/backups/plotSheet-before-c67-20261022" --remote --file=/tmp/noorpur-old-source --content-type='text/csv; charset=utf-8'
          else
            echo 'NOORPUR_SOURCE_CSV_NOT_FOUND: inventory removal still safe; archived D1 data remains authoritative'
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove Noorpur C6/C7 from draft and published inventories
        if: env.NOORPUR_MIGRATE == 'true'
        run: npx wrangler d1 execute tiyansh-production --remote --file=scripts/sql/noorpur-remove-c6-c7-published-once.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify 209 Noorpur live polygons and update existing source CSV
        if: env.NOORPUR_MIGRATE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ID=ca24581e-0dbc-41d7-964b-435c563534cd
          B=tiyansh-gallery-production
          if [[ "${NOORPUR_SOURCE_HAS_C67:-false}" == true ]]; then
            mime=$(file -b --mime-type /tmp/noorpur-new-source)
            npx wrangler r2 object put "$B/projects/$ID/mapper/plotSheet" --remote --file=/tmp/noorpur-new-source --content-type="$mime"
            npx wrangler r2 object get "$B/projects/$ID/mapper/plotSheet" --remote --file=/tmp/noorpur-source-readback
            cmp /tmp/noorpur-new-source /tmp/noorpur-source-readback
          fi
          npx wrangler d1 execute tiyansh-production --remote --json --command "SELECT p.publish_version AS version,(SELECT COUNT(*) FROM plots WHERE project_id=p.id AND inventory_active=1) AS draft,(SELECT COUNT(*) FROM published_plots WHERE project_id=p.id) AS published,(SELECT COUNT(*) FROM plots WHERE project_id=p.id AND id IN ('C6','C7')) AS removedDraftPresent,(SELECT COUNT(*) FROM published_plots WHERE project_id=p.id AND id IN ('C6','C7')) AS removedPublishedPresent,(SELECT COUNT(*) FROM plots WHERE project_id=p.id AND id LIKE 'B%') AS bCount,(SELECT COUNT(*) FROM plots WHERE project_id=p.id AND id LIKE 'C%') AS cCount,(SELECT publish_version FROM project_public_snapshots WHERE project_id=p.id) AS snapshotVersion FROM projects p WHERE p.id='$ID';" > /tmp/noorpur-final.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const json=JSON.parse(fs.readFileSync('/tmp/noorpur-final.json','utf8'));
          const r=json.flatMap(x=>x.results||[])[0];
          if(!r||Number(r.version)!==13||Number(r.snapshotVersion)!==13||Number(r.draft)!==209||Number(r.published)!==209||Number(r.removedDraftPresent)!==0||Number(r.removedPublishedPresent)!==0||Number(r.bCount)!==14||Number(r.cCount)!==5)
            throw Error('NOORPUR_209_PUBLISH_READBACK_FAILED');
          console.log('NOORPUR_209_PUBLISH_VERIFIED: 209 draft + 209 published, B1-B14, C1-C5, no C6/C7, version 13');
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # One-time, guarded data correction from the user's approved workbook.
      # This is production-only; browser E2E local D1 migrations do not run it.
      - name: Apply Anandvan workbook area values once
        run: npx wrangler d1 execute tiyansh-production --remote --config wrangler.jsonc --file=scripts/sql/apply-anandvan-area-values-once.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Prepare Rekixo Generic Client Sites Worker
        run: node scripts/prepare-cloudflare-deploy.mjs client
        env:
          REKIXO_WORKERS_SUBDOMAIN: ${{ vars.REKIXO_WORKERS_SUBDOMAIN }}
          REKIXO_PLATFORM_HOST: ${{ vars.REKIXO_PLATFORM_HOST }}
          REKIXO_SHARED_ADMIN_HOST: ${{ vars.REKIXO_SHARED_ADMIN_HOST }}

      # First deploy creates rekixo-client-sites on accounts where it does not yet exist.
      - name: Deploy Rekixo Generic Client Sites Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload Generic Client session secret
        run: |
          node -e 'process.stdout.write(JSON.stringify({SESSION_SECRET:process.env.SESSION_SECRET}))' | npx wrangler secret bulk --name rekixo-client-sites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Verify Tiyansh on Generic Client runtime
        run: node scripts/verify-tiyansh-generic-parity.mjs generic
        env:
          REKIXO_PLATFORM_HOST: ${{ vars.REKIXO_PLATFORM_HOST }}
          REKIXO_WORKERS_SUBDOMAIN: ${{ vars.REKIXO_WORKERS_SUBDOMAIN }}

      # Zero-downtime rollback/routing bridge. The browser runtime itself is generic.
      - name: Prepare Legacy Tiyansh Worker
        run: node scripts/prepare-cloudflare-deploy.mjs legacy
        env:
          REKIXO_WORKERS_SUBDOMAIN: ${{ vars.REKIXO_WORKERS_SUBDOMAIN }}
          REKIXO_PLATFORM_HOST: ${{ vars.REKIXO_PLATFORM_HOST }}
          REKIXO_SHARED_ADMIN_HOST: ${{ vars.REKIXO_SHARED_ADMIN_HOST }}

      - name: Upload Legacy Client session secret
        run: |
          node -e 'process.stdout.write(JSON.stringify({SESSION_SECRET:process.env.SESSION_SECRET}))' | npx wrangler secret bulk --name tiyansh-prime-square
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Deploy Legacy Tiyansh Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Tiyansh legacy bridge isolation
        run: node scripts/verify-tiyansh-generic-parity.mjs post-legacy
        env:
          REKIXO_PLATFORM_HOST: ${{ vars.REKIXO_PLATFORM_HOST }}
          REKIXO_WORKERS_SUBDOMAIN: ${{ vars.REKIXO_WORKERS_SUBDOMAIN }}

      - name: Prepare Rekixo Super Admin Worker
        run: node scripts/prepare-cloudflare-deploy.mjs super
        env:
          REKIXO_WORKERS_SUBDOMAIN: ${{ vars.REKIXO_WORKERS_SUBDOMAIN }}
          REKIXO_PLATFORM_HOST: ${{ vars.REKIXO_PLATFORM_HOST }}
          REKIXO_SHARED_ADMIN_HOST: ${{ vars.REKIXO_SHARED_ADMIN_HOST }}

      - name: Upload Super Admin credentials
        run: |
          node -e 'process.stdout.write(JSON.stringify({ADMIN_EMAIL:process.env.ADMIN_EMAIL,ADMIN_PASSWORD_SALT:process.env.ADMIN_PASSWORD_SALT,ADMIN_PASSWORD_HASH:process.env.ADMIN_PASSWORD_HASH,SESSION_SECRET:process.env.SESSION_SECRET}))' | npx wrangler secret bulk --name rekixo-super-admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD_SALT: ${{ secrets.ADMIN_PASSWORD_SALT }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Deploy Rekixo Super Admin Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
