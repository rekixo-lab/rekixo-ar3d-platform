name: WhatsApp Public Preview Probe
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/whatsapp-public-probe.mjs"
      - ".github/workflows/whatsapp-public-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/whatsapp-public-probe.mjs
